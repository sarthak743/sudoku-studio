[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-studio"
version = "0.1.0"
description = "A multi-algorithm, multi-language Sudoku solving platform"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["solvers/python"]
include = ["sudoku_solvers*"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = [
    "solvers/python/tests",
    "backend/tests",
]
pythonpath = [
    "solvers/python",
    "backend",
]
addopts = "-ra"

# Coverage configuration
[tool.coverage.run]
source = [
    "solvers/python/sudoku_solvers",
    "backend/app",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mypy configuration
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true