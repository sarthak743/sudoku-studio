name: Sudoku Studio CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Check formatting
        run: ruff format --check solvers/python

      - name: Lint Python code
        run: ruff check solvers/python

      - name: Validate JSON fixtures
        run: |
          python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('data/puzzles').glob('*.json')]; print('All JSON fixtures are valid')"